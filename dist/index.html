<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vuyama Bot Admin Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for direct JSX rendering -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Tailwind Theme Customizations -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
              950: '#2e1065',
            },
            darkbg: {
              DEFAULT: 'var(--bg-default)',
              card: 'var(--bg-card)',
              border: 'var(--border-default)',
              input: 'var(--input-default)'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Premium Custom Scrollbar, Theme Variables and Transitions CSS -->
  <style>
    /* CSS Variables for Premium Dynamic Styling */
    :root {
      --bg-default: #f8fafc;
      --bg-card: #ffffff;
      --border-default: rgba(226, 232, 240, 0.8);
      --input-default: #ffffff;
      --scrollbar-thumb: #cbd5e1;
      --scrollbar-thumb-hover: #94a3b8;
    }
    .dark {
      --bg-default: #0b0f19;
      --bg-card: #111827;
      --border-default: #1f2937;
      --input-default: #1f2937;
      --scrollbar-thumb: #1f2937;
      --scrollbar-thumb-hover: #374151;
    }

    /* Custom Scrollbar Styles */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }
    
    /* Smooth transition */
    * {
      transition-property: background-color, border-color, text-decoration-color, fill, stroke;
      transition-duration: 200ms;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    
    /* Mobile Slide-in Animation */
    @keyframes slideIn {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    .animate-slide-in {
      animation: slideIn 220ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    /* Glassmorphism */
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-color: rgba(226, 232, 240, 0.8);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
    }
    .dark .glass {
      background: rgba(17, 24, 39, 0.75);
      border-color: rgba(31, 41, 55, 0.8);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
    }

    /* Elegant Font Colors override for premium contrast */
    h1, h2, h3, h4, h5, h6 {
      color: #0f172a;
    }
    .dark h1, .dark h2, .dark h3, .dark h4, .dark h5, .dark h6 {
      color: #f8fafc;
    }

    /* Soft border corrections for inputs in both modes */
    input, select, textarea {
      background-color: var(--input-default) !important;
      border-color: var(--border-default) !important;
      color: #0f172a !important;
    }
    .dark input, .dark select, .dark textarea {
      color: #f8fafc !important;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #8b5cf6 !important;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1) !important;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-darkbg text-gray-800 dark:text-gray-100 font-sans min-h-screen">
  
  <div id="root"></div>

  <!-- React JSX Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Premium Raw SVGs for beautiful icons without external dependencies
    const Icons = {
      Dashboard: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
      Products: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>,
      Customers: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" /></svg>,
      Orders: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>,
      Complaints: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
      Blocked: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" /></svg>,
      Media: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
      Logs: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
      Settings: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Sun: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.364l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" /></svg>,
      Moon: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>,
      Send: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>,
      Upload: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
      Refresh: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" /></svg>,
      Trash: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Check: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>,
      Search: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
      Pin: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v3.586a1 1 0 00.293.707l2.828 2.828a1 1 0 01-.707 1.707h-3.414a1 1 0 00-.707.293l-2.828 2.828a1 1 0 01-1.707-.707V13a1 1 0 00-.293-.707L4.293 9.464A1 1 0 015 7.757V5z" /></svg>,
      AlertCircle: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
      ArrowLeft: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>,
      Plus: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [orderSubTab, setOrderSubTab] = useState('semua');
      const [darkMode, setDarkMode] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [botStatus, setBotStatus] = useState({ status: 'disconnected', qr: null });
      
      // Data Stores
      const [products, setProducts] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [orders, setOrders] = useState([]);
      const [complaints, setComplaints] = useState([]);
      const [blockedNumbers, setBlockedNumbers] = useState([]);
      const [media, setMedia] = useState([]);
      const [logs, setLogs] = useState([]);
      const [settings, setSettings] = useState({ company: [], reseller: [], services: [], escalationKeywords: '' });

      // Live Chat States
      const [activeChat, setActiveChat] = useState(null);
      const [chatMessages, setChatMessages] = useState([]);
      const [typedMessage, setTypedMessage] = useState('');
      const [chatSearch, setChatSearch] = useState('');
      
      // Filter & Loaders
      const [productSearch, setProductSearch] = useState('');
      const [productCategory, setProductCategory] = useState('');
      const [productModalOpen, setProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [productForm, setProductForm] = useState({ id: '', name: '', category: '', sub_category: '', description: '', price_retail: '', price_reseller: '', color: [], size: [], material: '', weight: '', stock: '', image: '', status: 'Tersedia' });
      const [uploadingExcel, setUploadingExcel] = useState(false);
      const [uploadingImage, setUploadingImage] = useState(false);
      
      // Stock confirmation modal states
      const [confirmModalOpen, setConfirmModalOpen] = useState(false);
      const [selectedConfirmOrder, setSelectedConfirmOrder] = useState(null);
      const [confirmForm, setConfirmForm] = useState({ productId: '', quantity: 1, total: 0 });
      
      // Settings Edit State
      const [editingSetting, setEditingSetting] = useState(null);
      const [settingValue, setSettingValue] = useState('');

      const chatEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const imgInputRef = useRef(null);
      const galleryInputRef = useRef(null);
      const logTerminalRef = useRef(null);

      // Notification Audio
      const notificationSound = useRef(new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-120.wav'));

      // Toggle Theme
      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
        if (darkMode) {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      };

      // Sound notification trigger
      const playNotification = () => {
        try {
          notificationSound.current.play();
        } catch (e) {}
      };

      // Fetch dynamic settings editor lists
      const fetchSettings = async () => {
        try {
          const res = await fetch('/api/settings');
          const d = await res.json();
          if (d.success) setSettings(d.data);
        } catch (e) {}
      };

      // Initial Fetch Loops
      const fetchBotStatus = async () => {
        try {
          const res = await fetch('/api/whatsapp/status');
          const d = await res.json();
          setBotStatus(d);
        } catch (e) {}
      };

      const fetchProducts = async () => {
        try {
          const catQuery = productCategory ? `&category=${productCategory}` : '';
          const res = await fetch(`/api/products?search=${productSearch}${catQuery}`);
          const d = await res.json();
          if (d.success) setProducts(d.data);
        } catch (e) {}
      };

      const fetchCustomers = async () => {
        try {
          const res = await fetch('/api/customers');
          const d = await res.json();
          if (d.success) setCustomers(d.data);
        } catch (e) {}
      };

      const fetchOrders = async () => {
        try {
          const res = await fetch('/api/orders');
          const d = await res.json();
          if (d.success) setOrders(d.data);
        } catch (e) {}
      };

      const fetchComplaints = async () => {
        try {
          const res = await fetch('/api/complaints');
          const d = await res.json();
          if (d.success) setComplaints(d.data);
        } catch (e) {}
      };

      const fetchBlockedNumbers = async () => {
        try {
          const res = await fetch('/api/blocked-numbers');
          const d = await res.json();
          if (d.success) setBlockedNumbers(d.data);
        } catch (e) {}
      };

      const fetchMedia = async () => {
        try {
          const res = await fetch('/api/media');
          const d = await res.json();
          if (d.success) setMedia(d.data);
        } catch (e) {}
      };

      const fetchLogs = async () => {
        try {
          const res = await fetch('/api/logs');
          const d = await res.json();
          if (d.success) setLogs(d.data);
        } catch (e) {}
      };

      // Fetch chat messages for active customer
      const loadChatMessages = async (phoneNumber) => {
        try {
          const res = await fetch(`/api/whatsapp/chats/${phoneNumber}`);
          const d = await res.json();
          if (d.success) {
            setChatMessages(d.data);
            // Refresh customers list to clear unread counts on dashboard
            fetchCustomers();
          }
        } catch (e) {}
      };

      const handleClearChatHistory = async (phoneNumber) => {
        if (!confirm('Apakah Anda yakin ingin menghapus seluruh riwayat chat customer ini dari CRM? Tindakan ini tidak bisa dibatalkan.')) return;
        try {
          const res = await fetch(`/api/whatsapp/chats/${phoneNumber}`, {
            method: 'DELETE'
          });
          const d = await res.json();
          if (d.success) {
            setChatMessages([]);
            alert('Riwayat chat berhasil dihapus.');
          }
        } catch (e) {
          alert('Gagal menghapus riwayat chat.');
        }
      };

      // On Initial Mount and tab switching
      useEffect(() => {
        fetchBotStatus();
        fetchProducts();
        fetchCustomers();
        fetchOrders();
        fetchComplaints();
        fetchBlockedNumbers();
        fetchMedia();
        fetchLogs();
        fetchSettings();

        // Connect Socket.IO
        const socket = io();

        socket.on('bot_status_update', (status) => {
          setBotStatus(status);
        });

        // Real-time messages update
        socket.on('incoming_message', (msg) => {
          // Add to messages if active chat
          if (activeChat && msg.phone_number === activeChat) {
            setChatMessages(prev => [...prev, msg]);
          }
          // Refresh list to update CRM UI
          fetchCustomers();
        });

        socket.on('chat_history_cleared', (data) => {
          if (activeChat && data.phone_number === activeChat) {
            setChatMessages([]);
          }
          fetchCustomers();
        });

        // Real-time order update
        socket.on('new_order', (order) => {
          fetchOrders();
          playNotification();
        });

        // Real-time complaint update
        socket.on('new_complaint', (comp) => {
          fetchComplaints();
          playNotification();
        });

        socket.on('customer_updated', () => {
          fetchCustomers();
        });

        socket.on('new_log', (log) => {
          setLogs(prev => [log, ...prev]);
        });

        return () => {
          socket.disconnect();
        };
      }, [activeChat]);

      // Triggers products fetch when search or category filter updates
      useEffect(() => {
        fetchProducts();
      }, [productSearch, productCategory]);

      // Scroll to bottom of chat window
      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages]);

      // Auto-scroll logs terminal
      useEffect(() => {
        if (logTerminalRef.current) {
          logTerminalRef.current.scrollTop = logTerminalRef.current.scrollHeight;
        }
      }, [logs]);

      // ======================== API ACTIONS ========================

      // Manual live chat reply
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!typedMessage.trim() || !activeChat) return;

        try {
          const res = await fetch('/api/whatsapp/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber: activeChat, message: typedMessage })
          });
          const d = await res.json();
          if (d.success) {
            setTypedMessage('');
            loadChatMessages(activeChat);
          }
        } catch (e) {}
      };

      // Excel Synchronization
      const handleExcelSync = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setUploadingExcel(true);
        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await fetch('/api/migration/import', {
            method: 'POST',
            body: formData
          });
          const d = await res.json();
          if (d.success) {
            alert('Sukses! Data Excel berhasil dimigrasikan dan disinkronisasikan ke Database.');
            fetchProducts();
            fetchSettings();
          } else {
            alert(`Gagal: ${d.error}`);
          }
        } catch (err) {
          alert(`Error: ${err.message}`);
        } finally {
          setUploadingExcel(false);
        }
      };

      // In-line settings editor
      const handleSaveSetting = async () => {
        if (!editingSetting) return;
        try {
          const res = await fetch(`/api/settings/company/${editingSetting.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value: settingValue })
          });
          const d = await res.json();
          if (d.success) {
            alert('Sukses menyimpan informasi perusahaan!');
            setEditingSetting(null);
            fetchSettings();
          }
        } catch (e) {}
      };

      // CRUD Product Actions
      const handleProductFormSubmit = async (e) => {
        e.preventDefault();
        const url = editingProduct ? `/api/products/${editingProduct.id}` : '/api/products';
        const method = editingProduct ? 'PUT' : 'POST';

        try {
          const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...productForm,
              color: typeof productForm.color === 'string' ? productForm.color.split(',').map(c => c.trim()) : productForm.color,
              size: typeof productForm.size === 'string' ? productForm.size.split(',').map(s => s.trim()) : productForm.size
            })
          });
          const d = await res.json();
          if (d.success) {
            setProductModalOpen(false);
            setEditingProduct(null);
            fetchProducts();
            alert('Produk berhasil disimpan!');
          } else {
            alert(`Error: ${d.error}`);
          }
        } catch (e) {

                    </div>

                    <div className="space-y-1.5">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Sub Kategori</span>
                      <input 
                        type="text" 
                        value={productForm.sub_category}
                        onChange={(e) => setProductForm({...productForm, sub_category: e.target.value})}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                      />
                    </div>

                    {/* Pricings */}
                    <div className="space-y-1.5">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Harga Umum (Retail) (Rp)</span>
                      <input 
                        type="number" 
                        value={productForm.price_retail}
                        onChange={(e) => setProductForm({...productForm, price_retail: e.target.value})}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                      />
                    </div>

                    <div className="space-y-1.5">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Harga Reseller (Rp)</span>
                      <input 
                        type="number" 
                        value={productForm.price_reseller}
                        onChange={(e) => setProductForm({...productForm, price_reseller: e.target.value})}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                      />
                    </div>

                    {/* Details */}
                    <div className="space-y-1.5">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Material / Bahan</span>
                      <input 
                        type="text" 
                        value={productForm.material}
                        onChange={(e) => setProductForm({...productForm, material: e.target.value})}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                      />
                    </div>

                    <div className="space-y-1.5">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Pilihan Ukuran (Koma dipisahkan, cth: All Size, XL)</span>
                      <input 
                        type="text" 
                        value={productForm.size}
                        onChange={(e) => setProductForm({...productForm, size: e.target.value})}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                      />
                    </div>

                    <div className="space-y-1.5">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Pilihan Warna (Koma dipisahkan, cth: Maroon, Navy)</span>
                      <input 
                        type="text" 
                        value={productForm.color}
                        onChange={(e) => setProductForm({...productForm, color: e.target.value})}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div className="space-y-1.5">
                        <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Berat (Gram)</span>
                        <input 
                          type="number" 
                          value={productForm.weight}
                          onChange={(e) => setProductForm({...productForm, weight: e.target.value})}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                        />
                      </div>
                      <div className="space-y-1.5">
                        <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Stok</span>
                        <input 
                          type="number" 
                          value={productForm.stock}
                          onChange={(e) => setProductForm({...productForm, stock: e.target.value})}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Deskripsi Produk</span>
                    <textarea 
                      rows="3"
                      value={productForm.description}
                      onChange={(e) => setProductForm({...productForm, description: e.target.value})}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none resize-none leading-relaxed"
                    />
                  </div>

                  {/* IMAGE UPLOAD & PREVIEW */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2 border-t border-darkbg-border">
                    <div className="space-y-2">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Unggah Gambar Produk</span>
                      <button 
                        type="button" 
                        onClick={() => imgInputRef.current.click()}
                        disabled={uploadingImage}
                        className="w-full py-3 rounded-xl bg-gray-800 border border-dashed border-darkbg-border text-xs text-gray-400 font-bold hover:text-white transition"
                      >
                        {uploadingImage ? 'Mengunggah...' : 'Pilih File Gambar'}
                      </button>
                      <input 
                        type="file" 
                        ref={imgInputRef} 
                        onChange={handleProductImageUpload} 
                        accept="image/*" 
                        className="hidden" 
                      />
                      
                      <div className="space-y-1 text-[10px]">
                        <span className="text-gray-600 font-semibold uppercase">Atau URL Gambar</span>
                        <input 
                          type="text" 
                          value={productForm.image}
                          onChange={(e) => setProductForm({...productForm, image: e.target.value})}
                          className="w-full px-3 py-2 rounded-lg bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                        />
                      </div>
                    </div>

                    <div className="h-32 rounded-xl bg-gray-800 border border-darkbg-border flex items-center justify-center overflow-hidden">
                      {productForm.image ? (
                        <img src={productForm.image} alt="Preview" className="w-full h-full object-cover" />
                      ) : (
                        <span className="text-[10px] text-gray-600 font-bold uppercase tracking-wider">Preview Uploader</span>
                      )}
                    </div>
                  </div>

                  {/* Actions Footer */}
                  <div className="pt-4 border-t border-darkbg-border flex items-center justify-end space-x-3 shrink-0">
                    <button type="button" onClick={() => setProductModalOpen(false)} className="px-4 py-2.5 rounded-xl bg-gray-850 hover:bg-gray-800 font-bold text-xs text-gray-400 transition">Cancel</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 font-extrabold text-xs text-white shadow-lg transition">Save Product</button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ==================== CONFIRM PURCHASE DIALOG MODAL ==================== */}
          {confirmModalOpen && selectedConfirmOrder && (
            <div className="fixed inset-0 z-50 glass flex items-center justify-center p-4">
              <div className="w-full max-w-lg rounded-2xl bg-white dark:bg-darkbg-card border border-darkbg-border overflow-hidden shadow-2xl flex flex-col">
                
                {/* Modal Header */}
                <div className="px-6 py-4 border-b border-darkbg-border flex items-center justify-between bg-gray-50 dark:bg-gray-850/20">
                  <h3 className="font-extrabold text-sm">Konfirmasi Pembelian (Order #{selectedConfirmOrder.id})</h3>
                  <button onClick={() => setConfirmModalOpen(false)} className="p-1 rounded bg-gray-850 text-gray-500 hover:text-white">✕</button>
                </div>

                {/* Modal Content Form */}
                <form onSubmit={handleConfirmPurchaseSubmit} className="p-6 space-y-5">
                  <div className="space-y-1.5">
                    <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Pilih Produk yang Dibeli</span>
                    <select 
                      required
                      value={confirmForm.productId}
                      onChange={(e) => setConfirmForm({ ...confirmForm, productId: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                    >
                      <option value="">-- Pilih Produk --</option>
                      {products.map(p => (
                        <option key={p.id} value={p.id}>
                          {p.name} (Stok: {p.stock} pcs)
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-1.5">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Jumlah Pembelian (Pcs)</span>
                      <input 
                        type="number" 
                        min="1"
                        required
                        value={confirmForm.quantity}
                        onChange={(e) => setConfirmForm({ ...confirmForm, quantity: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                      />
                    </div>

                    <div className="space-y-1.5">
                      <span className="text-[10px] text-gray-500 font-extrabold uppercase tracking-wide">Total Harga Final (Rp)</span>
                      <input 
                        type="number" 
                        required
                        value={confirmForm.total}
                        onChange={(e) => setConfirmForm({ ...confirmForm, total: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-gray-800 border border-darkbg-border text-xs focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="p-3.5 rounded-xl bg-emerald-500/5 border border-emerald-500/10 text-[10px] font-semibold text-gray-400 leading-relaxed">
                    💡 <strong>Info Potong Stok:</strong> Saat Anda klik tombol konfirmasi di bawah, sistem secara otomatis akan mengurangi stok produk terpilih sejumlah pcs yang dibeli di atas, mengubah status pesanan ke <strong>CONFIRMED</strong>, dan mencatat rekam audit.
                  </div>

                  {/* Actions Footer */}
                  <div className="pt-4 border-t border-darkbg-border flex items-center justify-end space-x-3">
                    <button type="button" onClick={() => setConfirmModalOpen(false)} className="px-4 py-2.5 rounded-xl bg-gray-850 hover:bg-gray-800 font-bold text-xs text-gray-400 transition">Cancel</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white shadow-lg transition">Konfirmasi & Kurangi Stok</button>
                  </div>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
