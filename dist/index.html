<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vuyama Bot Admin Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for direct JSX rendering -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Tailwind Theme Customizations -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
              950: '#2e1065',
            },
            darkbg: {
              DEFAULT: 'var(--bg-default)',
              card: 'var(--bg-card)',
              border: 'var(--border-default)',
              input: 'var(--input-default)'
            }
          }
        }
      }
    }
  </script>

  <!-- Premium Custom Scrollbar, Theme Variables and Transitions CSS -->
  <style>
    /* CSS Variables for Premium Dynamic Styling */
    :root {
      --bg-default: #f8fafc;
      --bg-card: #ffffff;
      --border-default: rgba(226, 232, 240, 0.8);
      --input-default: #ffffff;
      --scrollbar-thumb: #cbd5e1;
      --scrollbar-thumb-hover: #94a3b8;
    }

    .dark {
      --bg-default: #0b0f19;
      --bg-card: #111827;
      --border-default: #1f2937;
      --input-default: #1f2937;
      --scrollbar-thumb: #1f2937;
      --scrollbar-thumb-hover: #374151;
    }

    /* Custom Scrollbar Styles */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    /* Smooth transition - optimized for specific interactive components to prevent global DOM layout thrashing */
    button, a, input, select, textarea, .hover-transition {
      transition-property: background-color, border-color, text-decoration-color, fill, stroke, opacity;
      transition-duration: 200ms;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }


    /* Mobile Slide-in Animation */
    @keyframes slideIn {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(0);
      }
    }

    .animate-slide-in {
      animation: slideIn 220ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Glassmorphism */
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-color: rgba(226, 232, 240, 0.8);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
    }

    .dark .glass {
      background: rgba(17, 24, 39, 0.75);
      border-color: rgba(31, 41, 55, 0.8);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
    }

    /* Elegant Font Colors override for premium contrast */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: #0f172a;
    }

    .dark h1,
    .dark h2,
    .dark h3,
    .dark h4,
    .dark h5,
    .dark h6 {
      color: #f8fafc;
    }

    /* Soft border corrections for inputs in both modes */
    input,
    select,
    textarea {
      background-color: var(--input-default) !important;
      border-color: var(--border-default) !important;
      color: #0f172a !important;
    }

    .dark input,
    .dark select,
    .dark textarea {
      color: #f8fafc !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #8b5cf6 !important;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1) !important;
    }

    /* Premium Toast Slide-Up Animation */
    @keyframes slideUp {
      from {
        transform: translateY(100%) scale(0.95);
        opacity: 0;
      }

      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .animate-toast-in {
      animation: slideUp 280ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="bg-gray-50 dark:bg-darkbg text-gray-800 dark:text-gray-100 font-sans min-h-screen">

  <div id="root"></div>

  <!-- React JSX Application Code -->
  <script type="text/babel" src="/js/icons.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/ToastNotification.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/ConfirmOrderModal.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/EditOrderModal.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/ProductModal.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/DashboardTab.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/ProductsTab.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/LiveChatTab.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/OrdersTab.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/ComplaintsTab.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/BlockedTab.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/LogsTab.js?v=1.3"></script>
  <script type="text/babel" src="/js/components/SettingsTab.js?v=1.3"></script>
  <script type="text/babel" src="/js/app.js?v=1.3"></script>

  <!-- React Bootstrap -->
  <script type="text/babel">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<window.App />);
  </script>
</body>

</html>
